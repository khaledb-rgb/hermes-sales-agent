name: Hermes Daily Report

on:
  schedule:
    # 13:00 & 14:00 UTC bracket 08:00 America/Chicago across DST. run_report.py
    # proceeds only at 08:00 Central, so it fires exactly once per day year-round.
    - cron: "0 13,14 * * *"
  workflow_dispatch:        # allow manual trigger from GitHub UI (always runs)

permissions:
  contents: write           # needed to save report files to the repo

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Hermes
        env:
          GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          GHL_COMPANY_ID: ${{ secrets.GHL_COMPANY_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPORT_TIMEZONE: America/Chicago
          CALENDLY_API_KEY: ${{ secrets.CALENDLY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: khaledb-rgb
          GITHUB_REPO: hermes-sales-agent
        run: python run_report.py

name: Keep Vercel Warm

on:
  schedule:
    - cron: "*/3 * * * *"   # every 3 minutes — warms GHL cache before it expires

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping webhook health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://hermes-sales-agent.vercel.app/api/webhook)
          echo "Health check status: $STATUS"

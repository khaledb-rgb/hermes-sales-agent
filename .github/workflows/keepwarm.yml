name: Keep Vercel Warm

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes — prevents Python cold starts

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping webhook health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://hermes-sales-agent.vercel.app/api/webhook)
          echo "Health check status: $STATUS"
